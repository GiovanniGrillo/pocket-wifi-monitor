<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Reception statistics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f7b733'/><stop offset='1' stop-color='%23f59e0b'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><text x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-size='15' font-weight='bold' text-anchor='middle' fill='%233a2600'>PW</text></svg>">
<script>try{var _t=localStorage.getItem('pw_theme');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* minimal editorial palette: warm neutral, one desaturated data trio */
    --accent:#3f7d54;--warn:#b5862f;--bad:#b5524b;
    --radius:12px;--radius-sm:9px;--shadow:none;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* light default */
    --bg:#f1f0ec;--panel:#ffffff;--panel-2:#f6f5f1;--line:#e4e2db;--line-soft:#ece9e1;--line-strong:#d6d3ca;
    --txt:#1b1a17;--dim:#6a6760;--faint:#9c978c;
    --ink-pill:#1b1a17;--pill-ink:#f1f0ec;--bar:#cfcbc0;
    --ink:var(--txt);--ok:var(--accent);  /* aliases shared with the other pages */
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#141310;--panel:#1b1a16;--panel-2:#201e19;--line:#2d2b25;--line-soft:#242219;--line-strong:#3a382f;--txt:#ece9e1;--dim:#9c978c;--faint:#6a6760;--accent:#6aa77f;--warn:#d2a24e;--bad:#cf6f67;--ink-pill:#ece9e1;--pill-ink:#141310;--bar:#4a473f;}
  }
  :root[data-theme="dark"]{--bg:#141310;--panel:#1b1a16;--panel-2:#201e19;--line:#2d2b25;--line-soft:#242219;--line-strong:#3a382f;--txt:#ece9e1;--dim:#9c978c;--faint:#6a6760;--accent:#6aa77f;--warn:#d2a24e;--bad:#cf6f67;--ink-pill:#ece9e1;--pill-ink:#141310;--bar:#4a473f;}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono,.v,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .wrap{max-width:1200px;margin:22px auto;padding:0 16px 40px;}
  a{color:inherit;}

  .app{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 22px 26px;}
  .nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:18px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.3px;}
  .logo{width:28px;height:28px;border-radius:8px;flex:none;background:linear-gradient(140deg,#f7b733,#f59e0b);display:grid;place-items:center;color:#3a2600;font-weight:800;font-size:11px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);}
  .navlinks{display:flex;align-items:center;gap:3px;margin-left:8px;}
  .navlink{font-size:13px;font-weight:600;color:var(--dim);text-decoration:none;padding:7px 13px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s;}
  .navlink:hover{color:var(--txt);background:var(--panel-2);}
  .navlink.active{background:var(--ink-pill);color:var(--pill-ink);}
  .spacer{flex:1;}
  .nav-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hgroup{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 20px;}
  .page-title{margin:0;font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1;}
  .page-sub{margin:6px 0 0;font-size:12.5px;color:var(--dim);font-weight:500;}
  .btn{font:inherit;font-size:12px;font-weight:600;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s,color .15s;}
  .btn:hover{color:var(--txt);border-color:var(--faint);background:var(--panel-2);}
  .seg{display:inline-flex;align-items:baseline;gap:15px;border:0;background:none;}
  .seg button{font:inherit;font-size:12.5px;font-weight:600;background:none;color:var(--faint);border:0;padding:3px 0;cursor:pointer;transition:color .15s;letter-spacing:.2px;}
  .seg button:hover{color:var(--dim);}
  .seg button.on{color:var(--txt);box-shadow:inset 0 -2px 0 var(--txt);font-weight:700;}
  :focus-visible{outline:2px solid color-mix(in srgb,var(--txt) 40%,transparent);outline-offset:2px;}

  /* shell: sidebar + content */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;background:var(--bg);border-right:1px solid var(--line);}
  .brand{padding:4px 8px 16px;}
  .side-nav{display:flex;flex-direction:column;gap:3px;}
  .side-link{display:flex;align-items:center;gap:11px;height:34px;box-sizing:border-box;font-size:13px;font-weight:600;color:var(--dim);text-decoration:none;padding:9px 11px;border-radius:8px;transition:background .15s,color .15s;cursor:pointer;}
  .side-link:hover{color:var(--txt);background:var(--panel-2);}
  .side-link.active{color:var(--txt);background:var(--panel-2);box-shadow:inset 2px 0 0 var(--txt);}
  .side-link .ic{width:15px;text-align:center;opacity:.8;font-size:12px;}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);}
  .side-status{display:inline-flex;align-items:center;gap:8px;padding:0 4px;font-size:12.5px;font-weight:600;color:var(--bad);}
  .side-status.online{color:var(--ok);}
  .side-status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .side-age{padding-left:16px;}
  .content{flex:1;min-width:0;padding:16px 28px 40px;}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;padding:10px 0 14px;margin-bottom:8px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);}
  .tb-title .page-title{font-size:26px;} .tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  button.ghost{font:inherit;font-size:12.5px;font-weight:600;color:var(--dim);background:none;border:0;padding:3px 4px;cursor:pointer;transition:color .15s;}
  button.ghost:hover{color:var(--txt);}
  .iconbtn{display:none;font:inherit;font-size:18px;line-height:1;background:none;border:1px solid var(--line);border-radius:8px;color:var(--txt);width:36px;height:36px;cursor:pointer;}
  select.filter{font:inherit;font-size:12px;font-weight:600;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;}
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);}
    .shell.nav-open .sidebar{transform:none;} .shell.nav-open .scrim{display:block;}
    .iconbtn{display:block;} .content{padding:14px 16px 36px;} .tb-title .page-title{font-size:21px;}
  }

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .controls label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;}
  select,input[type=number]{font:inherit;font-size:12.5px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 9px;}
  input[type=number]{width:84px;}

  /* verdict — flat, editorial */
  .hero{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;padding:8px 0 24px;margin-bottom:0;border-bottom:1px solid var(--line);}
  .badge{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;padding:0;border:0;background:none;white-space:nowrap;}
  .badge.good{color:var(--accent);} .badge.borderline{color:var(--warn);} .badge.bad{color:var(--bad);} .badge.unknown{color:var(--faint);}
  .hero .badge{font-size:22px;font-weight:800;letter-spacing:-.4px;text-transform:none;line-height:1.1;}
  .hero .for{font-size:11.5px;color:var(--faint);}
  .hero .summary{font-size:14.5px;color:var(--txt);max-width:60ch;line-height:1.6;text-wrap:pretty;}
  .hero .col{display:flex;flex-direction:column;gap:5px;flex:none;min-width:150px;}

  /* kpi row — inline, no boxes */
  .kpis{display:flex;flex-wrap:wrap;gap:48px;background:none;border:0;box-shadow:none;border-radius:0;overflow:visible;padding:20px 0;margin:0;border-bottom:1px solid var(--line);}
  .kpi{background:none;padding:0;}
  .kpi .l{font-size:10px;text-transform:lowercase;letter-spacing:.2px;color:var(--faint);font-weight:600;}
  .kpi .v{font-size:25px;font-weight:700;letter-spacing:-.6px;margin-top:3px;font-variant-numeric:tabular-nums;}
  .kpi .v small{font-size:12px;color:var(--dim);font-weight:500;}
  .kpi .cap{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.4;}
  .v.good{color:var(--accent);} .v.warn{color:var(--warn);} .v.bad{color:var(--bad);}

  .card{background:none;border:0;border-radius:0;box-shadow:none;padding:24px 0;margin:0;border-bottom:1px solid var(--line);}
  .card:last-child{border-bottom:0;}
  .card h2{margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:-.1px;color:var(--txt);}
  .card .hint{display:none;}  /* editorial: fewer words — detail lives in the glossary */

  /* signal meter */
  .meter{position:relative;height:4px;border-radius:2px;display:flex;margin:16px 0 10px;}
  .meter .z{height:100%;} .meter .zb{background:color-mix(in srgb,var(--bad) 40%,var(--bg));border-radius:2px 0 0 2px;}
  .meter .zf{background:color-mix(in srgb,var(--warn) 40%,var(--bg));}
  .meter .zg{background:color-mix(in srgb,var(--accent) 40%,var(--bg));border-radius:0 2px 2px 0;}
  .meter .marker{position:absolute;top:-7px;width:2px;height:18px;background:var(--txt);transform:translateX(-1px);}
  .meter-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-family:var(--mono);}
  .meter-val{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .meter-val .w{font-size:16px;font-weight:600;} .meter-val .n{font-family:var(--mono);color:var(--dim);font-size:12px;}

  svg{display:block;width:100%;height:auto;}
  .callout{font-size:12.5px;margin-top:12px;padding:0;border-radius:0;background:none;border:0;color:var(--dim);}
  .daystrip{display:flex;gap:4px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin;}
  .daycell{flex:0 0 auto;min-width:46px;cursor:pointer;padding:4px 4px 6px;text-align:left;}
  .daycell .dq{height:3px;margin-bottom:8px;opacity:.9;}
  .daycell .dd{font-size:11px;color:var(--faint);font-family:var(--mono);line-height:1.3;}
  .daycell .dp{font-size:11px;color:var(--dim);font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .daycell:hover .dd{color:var(--dim);}
  .daycell.sel .dd,.daycell.sel .dp{color:var(--txt);font-weight:700;}
  .daycell.sel .dq{height:4px;opacity:1;}
  .callout b{color:var(--txt);font-weight:600;}
  ul.concl{margin:0;padding-left:16px;} ul.concl li{margin:7px 0;font-size:13px;} ul.concl b{color:var(--txt);font-weight:600;}
  .gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 18px;}
  .gloss div{font-size:11.5px;color:var(--dim);} .gloss b{color:var(--txt);font-weight:600;}
  .muted{color:var(--faint);}
  footer{margin-top:18px;text-align:center;font-size:11px;color:var(--faint);font-family:var(--mono);}
</style>
</head>
<body>
<div class="shell" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar">
    <div class="brand"><span class="logo">PW</span> Pocket-WiFi</div>
    <nav class="side-nav">
      <a class="side-link" href="/"><span class="ic">▚</span><span id="nav_overview">Overview</span></a>
      <a class="side-link active" href="/stats"><span class="ic">▤</span><span id="nav_analytics">Analytics</span></a>
      <a class="side-link" href="/explore"><span class="ic">▦</span><span id="nav_data">Data</span></a>
    </nav>
    <div class="side-foot">
      <span class="side-status" id="statusPill"><span class="dot"></span><span id="statusText">offline</span></span>
      <span class="side-age" id="foot">—</span>
    </div>
  </aside>

  <main class="content" id="top">
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="tb-title">
        <h1 class="page-title" id="t_title">Reception statistics</h1>
        <p class="page-sub" id="sub">loading…</p>
      </div>
      <div class="spacer"></div>
      <div class="tb-actions">
        <select class="filter" id="profile"></select>
        <span id="customWrap" style="display:none"><input type="number" id="customMbps" min="1" max="1000" value="10"> <span class="muted" id="t_target">target Mbps</span></span>
        <div class="seg" id="segDays"><button data-d="7">7</button><button data-d="30" class="on">30</button><button data-d="365" id="t_all">all</button></div>
        <button class="ghost" id="themeBtn" title="Theme" aria-label="Theme">dark</button>
        <button class="ghost" id="langBtn">IT</button>
      </div>
    </header>

  <!-- verdict + plain summary -->
  <section class="hero">
    <div class="col"><span class="badge unknown" id="vLvl">—</span><span class="for" id="vFor"></span></div>
    <div class="summary" id="summary"></div>
  </section>

  <!-- signal meter -->
  <section class="card">
    <h2 id="t_meter">Signal strength</h2>
    <p class="hint" id="h_meter"></p>
    <div class="meter-val"><span class="w" id="meterWord">—</span><span class="n" id="meterNum"></span></div>
    <div class="meter"><div class="z zb" style="width:30%"></div><div class="z zf" style="width:20%"></div><div class="z zg" style="width:50%"></div><div class="marker" id="meterMark" style="left:0%"></div></div>
    <div class="meter-scale"><span>-120</span><span>-110</span><span>-100</span><span>-90</span><span>-70 dBm</span></div>
  </section>

  <div class="kpis" id="kpis"></div>

  <section class="card">
    <h2 id="t_byday">Day by day</h2>
    <p class="hint" id="h_byday"></p>
    <div class="daystrip" id="dayStrip"></div>
    <div class="callout" id="dayInfo"></div>
    <svg id="daySvg" viewBox="0 0 800 130" preserveAspectRatio="none"></svg>
  </section>

  <section class="card">
    <h2 id="t_hour">By hour of day</h2>
    <p class="hint" id="h_hour"></p>
    <svg id="hourChart" viewBox="0 0 800 150" preserveAspectRatio="none"></svg>
    <div class="callout" id="hourCallout"></div>
  </section>

  <section class="card">
    <h2 id="t_uptime">Sensor uptime</h2>
    <p class="hint" id="h_uptime"></p>
    <svg id="covChart" viewBox="0 0 800 80" preserveAspectRatio="none"></svg>
  </section>

  <section class="card">
    <h2 id="t_concl">What this means for you</h2>
    <ul class="concl" id="concl"><li class="muted">—</li></ul>
  </section>

  <section class="card">
    <h2 id="t_pot">Upgrade potential — dedicated 4G/5G router</h2>
    <p class="hint" id="h_pot"></p>
    <div style="margin-bottom:10px"><span class="badge unknown" id="potLvl">—</span></div>
    <ul class="concl" id="potBody"><li class="muted">—</li></ul>
  </section>

  <section class="card">
    <h2 id="t_gloss">Quick glossary</h2>
    <div class="gloss" id="gloss"></div>
  </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const dash=v=>(v===undefined||v===null||v==="")?null:v;
let days=30,last=null,lang=localStorage.getItem("pw_lang")||"en",selectedDay=null;
const L=(en,it)=>lang==="it"?it:en;

const PROFILES={family:{mbps:15,latSoft:120,latHard:250},uhd4k:{mbps:30,latSoft:150,latHard:300},
  work:{mbps:8,latSoft:60,latHard:120},basic:{mbps:4,latSoft:200,latHard:400},custom:{mbps:10,latSoft:120,latHard:250}};
let profile=localStorage.getItem("pw_profile")||"family";
const profName=id=>({family:L("Family / streaming","Famiglia / streaming"),uhd4k:L("Streaming 4K","Streaming 4K"),
  work:L("Remote work / calls","Smart working / videochiamate"),basic:L("Basic: web + smart home","Base: navigazione + domotica"),
  custom:L("Custom","Personalizzato")})[id];

function profileTarget(){const p={...PROFILES[profile]};if(profile==="custom")p.mbps=Math.max(1,parseInt($("customMbps").value,10)||10);return p;}

// RSRP -> plain word + color class + 0..1 position on the -120..-70 scale
function sig(rsrp){
  if(rsrp==null) return {w:"—",cls:"",pos:0};
  let w,cls;
  if(rsrp>=-90){w=L("strong","forte");cls="good";}
  else if(rsrp>=-100){w=L("good","buono");cls="good";}
  else if(rsrp>=-108){w=L("fair","discreto");cls="warn";}
  else if(rsrp>=-115){w=L("weak","scarso");cls="bad";}
  else {w=L("very weak","molto scarso");cls="bad";}
  const pos=Math.max(0,Math.min(1,(rsrp+120)/50));
  return {w,cls,pos};
}

function fillLabels(){
  document.documentElement.lang=lang;
  $("langBtn").textContent=lang==="it"?"EN":"IT";syncThemeBtn();
  $("t_title").textContent=L("Reception statistics","Statistiche presa rete");
  $("t_all").textContent=L("all","tutto");
  $("nav_overview").textContent=L("Overview","Panoramica");
  $("nav_analytics").textContent=L("Analytics","Analisi");
  $("nav_data").textContent=L("Data","Dati");
  $("t_target").textContent=L("target Mbps","target Mbps");
  $("t_meter").textContent=L("Signal strength","Potenza del segnale");
  $("h_meter").textContent=L("Where your typical signal sits. Green = comfortable, amber = usable, red = struggling.","Dove si colloca il segnale tipico. Verde = comodo, ambra = utilizzabile, rosso = in difficoltà.");
  $("t_byday").textContent=L("Day by day","Giorno per giorno");
  $("h_byday").textContent=L("Each cell is a day — colour = overall quality. Tap a day for its hour-by-hour detail; scroll for earlier days.","Ogni cella è un giorno — colore = qualità generale. Tocca un giorno per il dettaglio ora per ora; scorri per i giorni precedenti.");
  $("t_hour").textContent=L("By hour of day","Per ora del giorno");
  $("h_hour").textContent=L("How often the signal is usable at each hour (local time). Low bars = that hour tends to be bad — often the evening.","Quanto spesso il segnale è usabile a ogni ora (ora locale). Barre basse = quell'ora tende ad andare male — spesso la sera.");
  $("t_uptime").textContent=L("Sensor uptime","Attività del sensore");
  $("h_uptime").textContent=L("Samples received per time slot. Gaps = the phone or the PC was off.","Campioni ricevuti per fascia. Buchi = telefono o PC spenti.");
  $("t_concl").textContent=L("What this means for you","Cosa significa per te");
  $("t_pot").textContent=L("Upgrade potential — dedicated 4G/5G router","Potenziale upgrade — router 4G/5G dedicato");
  $("h_pot").textContent=L("The phone measures this spot's radio environment; a router with external antennas/CA can do better — but is bounded by the same coverage. Rough estimate, not a promise.","Il telefono misura l'ambiente radio del posto; un router con antenne esterne/CA può fare meglio — ma è vincolato alla stessa copertura. Stima indicativa, non una promessa.");
  $("t_gloss").textContent=L("Quick glossary","Glossario rapido");
  $("foot").textContent=L("updates every 60 s","aggiorna ogni 60 s");
  const sel=$("profile");sel.innerHTML=Object.keys(PROFILES).map(id=>`<option value="${id}">${profName(id)}</option>`).join("");sel.value=profile;
  $("customWrap").style.display=profile==="custom"?"":"none";
  $("gloss").innerHTML=[
    ["RSRP",L("signal power. Above −100 dBm is fine, below −110 is critical.","potenza del segnale. Sopra −100 dBm va bene, sotto −110 è critico.")],
    ["SINR",L("signal cleanliness. Higher = faster/steadier; near 0 = slow.","pulizia del segnale. Più alto = più veloce/stabile; vicino a 0 = lento.")],
    [L("Band","Banda"),L("radio band. Low bands (800/700 MHz) reach further and go through walls.","banda radio. Le bande basse (800/700 MHz) arrivano più lontano e bucano i muri.")],
    ["HTTP 204",L("proof the data actually works (and how fast it responds).","prova che il dato funziona davvero (e quanto è reattivo).")],
    [L("Bufferbloat","Bufferbloat"),L("extra delay when the line is busy — makes calls/streaming stutter.","ritardo extra quando la linea è occupata — fa scattare chiamate/streaming.")],
  ].map(([k,v])=>`<div><b>${k}</b> — ${v}</div>`).join("");
}

function kpi(label,value,cls,sub,cap){return `<div class="kpi"><div class="l">${label}</div><div class="v ${cls||''}">${value}${sub?` <small>${sub}</small>`:''}</div><div class="cap">${cap||''}</div></div>`;}

function renderKpis(h){
  // Only the analytics-unique KPIs here; the basic ones live on the Overview.
  const st=h.last_stress||{};
  const latAdd=(st.lat_idle_ms!=null&&st.lat_load_ms!=null)?Math.round(st.lat_load_ms-st.lat_idle_ms):null;
  const t=[];
  if(latAdd!=null) t.push(kpi(L("Lag under load","Lag sotto carico"),"+"+latAdd,latAdd<=120?"good":latAdd<=250?"warn":"bad","ms",L("extra delay when busy (bufferbloat)","ritardo extra quando occupato")));
  else t.push(kpi(L("Lag under load","Lag sotto carico"),"—","","",L("run a stress test to measure","fai uno stress test per misurare")));
  t.push(kpi(L("Main band","Banda principale"),h.band_main||"—",h.low_band_pct>0?"good":"","",h.low_band_pct>0?L(h.low_band_pct+"% low-band (good reach)",h.low_band_pct+"% banda bassa (buona portata)"):L("no low-band","nessuna banda bassa")));
  t.push(kpi(L("Covered","Coperti"),h.days_covered!=null?h.days_covered:"—","",L("days","giorni"),h.n?h.n.toLocaleString()+L(" samples"," campioni"):""));
  $("kpis").innerHTML=t.join("");
}

function renderMeter(h){
  const r=h.rsrp||{},s=sig(r.median);
  $("meterWord").textContent=s.w;$("meterWord").className="w "+(s.cls==="good"?"":"");
  $("meterWord").style.color=s.cls==="good"?"var(--accent)":s.cls==="warn"?"var(--warn)":s.cls==="bad"?"var(--bad)":"var(--faint)";
  $("meterNum").textContent=r.median!=null?`${r.median} dBm (min ${r.min} · max ${r.max})`:"";
  $("meterMark").style.left=(s.pos*100).toFixed(1)+"%";
  $("meterMark").style.display=r.median!=null?"":"none";
}

function renderHour(h){
  const bh=h.by_hour||[],W=800,H=150,padL=26,padR=8,padT=8,padB=22;
  const withData=bh.filter(b=>b.n&&b.ok_quality_pct!=null);
  if(!withData.length){$("hourChart").innerHTML=`<text x="400" y="75" fill="var(--faint)" font-size="13" text-anchor="middle">${L("no data yet","ancora nessun dato")}</text>`;$("hourCallout").textContent="";return;}
  const bw=(W-padL-padR)/24;let g="";
  for(let v=0;v<=100;v+=50){const yy=padT+(100-v)*(H-padT-padB)/100;g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)"/><text x="2" y="${yy+4}" fill="var(--faint)" font-size="9">${v}</text>`;}
  bh.forEach((b,i)=>{if(b.ok_quality_pct==null)return;const val=b.ok_quality_pct,hh=(H-padT-padB)*val/100,c=val>=80?"var(--bar)":val>=50?"var(--warn)":"var(--bad)",xx=padL+i*bw;
    g+=`<rect x="${(xx+1).toFixed(1)}" y="${(H-padB-hh).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${hh.toFixed(1)}" fill="${c}"><title>${b.hour}:00 — ${val}%</title></rect>`;});
  for(let hh=0;hh<24;hh+=3){const xx=padL+hh*bw+bw/2;g+=`<text x="${xx.toFixed(1)}" y="${H-6}" fill="var(--faint)" font-size="9" text-anchor="middle">${hh}</text>`;}
  $("hourChart").innerHTML=g;
  const worst=withData.reduce((a,b)=>b.ok_quality_pct<a.ok_quality_pct?b:a);
  const best=withData.reduce((a,b)=>b.ok_quality_pct>a.ok_quality_pct?b:a);
  $("hourCallout").innerHTML=L(
    `Weakest around <b>${worst.hour}:00</b> (${worst.ok_quality_pct}% usable) · strongest around <b>${best.hour}:00</b> (${best.ok_quality_pct}%).`,
    `Più debole verso le <b>${worst.hour}:00</b> (${worst.ok_quality_pct}% usabile) · migliore verso le <b>${best.hour}:00</b> (${best.ok_quality_pct}%).`);
}

function renderByDay(h){
  const bd=h.by_day||[];
  if(!bd.length){$("dayStrip").innerHTML=`<span class="muted">${L("no data yet","ancora nessun dato")}</span>`;$("dayInfo").textContent="";$("daySvg").innerHTML="";return;}
  if(!selectedDay||!bd.some(d=>d.date===selectedDay)) selectedDay=bd[bd.length-1].date;
  const qc=v=>v==null?"var(--line)":v>=80?"var(--bar)":v>=50?"var(--warn)":"var(--bad)";
  $("dayStrip").innerHTML=bd.map(d=>{const[,m,dd]=d.date.split("-");
    return `<div class="daycell${d.date===selectedDay?' sel':''}" data-day="${d.date}"><div class="dq" style="background:${qc(d.ok_quality_pct)}"></div><div class="dd">${dd}/${m}</div><div class="dp">${d.ok_quality_pct==null?'—':d.ok_quality_pct+'%'}</div></div>`;}).join("");
  const sel=$("dayStrip").querySelector(".daycell.sel"); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
  renderDayDetail(bd.find(d=>d.date===selectedDay));
}
function renderDayDetail(d){
  if(!d)return;
  const[,m,dd]=d.date.split("-");
  $("dayInfo").innerHTML=L(
    `<b>${dd}/${m}</b> · signal ${sig(d.rsrp_median).w} (${d.rsrp_median??'—'} dBm) · usable ${d.ok_quality_pct??'—'}% · data ok ${d.uplink_ok_pct??'—'}% · ${d.n} samples`,
    `<b>${dd}/${m}</b> · segnale ${sig(d.rsrp_median).w} (${d.rsrp_median??'—'} dBm) · usabile ${d.ok_quality_pct??'—'}% · dato ok ${d.uplink_ok_pct??'—'}% · ${d.n} campioni`);
  const W=800,H=130,padL=26,padR=8,padT=8,padB=20,bw=(W-padL-padR)/24;let g="";
  for(let v=0;v<=100;v+=50){const yy=padT+(100-v)*(H-padT-padB)/100;g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)"/><text x="2" y="${yy+4}" fill="var(--faint)" font-size="9">${v}</text>`;}
  (d.hours||[]).forEach((val,i)=>{if(val==null)return;const hh=(H-padT-padB)*val/100,c=val>=80?"var(--bar)":val>=50?"var(--warn)":"var(--bad)",xx=padL+i*bw;
    g+=`<rect x="${(xx+1).toFixed(1)}" y="${(H-padB-hh).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${hh.toFixed(1)}" fill="${c}"><title>${i}:00 — ${val}%</title></rect>`;});
  for(let hh=0;hh<24;hh+=3){const xx=padL+hh*bw+bw/2;g+=`<text x="${xx.toFixed(1)}" y="${H-5}" fill="var(--faint)" font-size="9" text-anchor="middle">${hh}</text>`;}
  $("daySvg").innerHTML=g;
}
function renderCov(h){
  const s=h.series||[],W=800,H=80,padB=4;
  if(!s.length){$("covChart").innerHTML=`<text x="400" y="40" fill="var(--faint)" font-size="12" text-anchor="middle">${L("no data yet","ancora nessun dato")}</text>`;return;}
  const maxN=Math.max(...s.map(p=>p.n),1),bw=W/s.length;
  $("covChart").innerHTML=s.map((p,i)=>{const hh=(H-padB)*p.n/maxN,c=p.ok_rate>=95?"var(--bar)":p.ok_rate>=50?"var(--warn)":"var(--bad)";return `<rect x="${(i*bw).toFixed(1)}" y="${(H-padB-hh).toFixed(1)}" width="${Math.max(1,bw-1).toFixed(1)}" height="${hh.toFixed(1)}" fill="${c}"/>`;}).join("");
}

const WORST=(...xs)=>{const o=["bad","borderline","good"];return xs.filter(Boolean).sort((a,b)=>o.indexOf(a)-o.indexOf(b))[0];};
function buildConclusions(h){
  const p=profileTarget(),b=[];
  if(!h||!h.n) return {level:"unknown",bullets:[L("No data yet — start the phone agent.","Nessun dato ancora — avvia l'agente sul telefono.")]};
  const rsrp=(h.rsrp||{}).median,okq=h.pct_ok_quality,up=h.uplink_ok_pct,st=h.last_stress||{};
  const mbps=dash(st.dl_mbps),latAdd=(st.lat_idle_ms!=null&&st.lat_load_ms!=null)?Math.round(st.lat_load_ms-st.lat_idle_ms):null;
  let cov=rsrp==null?null:(rsrp>=-100&&okq>=70)?"good":(rsrp>=-110&&okq>=40)?"borderline":"bad";
  if(rsrp!=null)b.push(L(`<b>Signal</b>: ${sig(rsrp).w} (${rsrp} dBm), usable ${okq}% of the time.`,`<b>Segnale</b>: ${sig(rsrp).w} (${rsrp} dBm), usabile nel ${okq}% del tempo.`));
  let rel=up==null?null:up>=95?"good":up>=80?"borderline":"bad";
  if(up!=null)b.push(L(`<b>Reliability</b>: data worked ${up}% of samples.`,`<b>Affidabilità</b>: il dato ha funzionato nel ${up}% dei campioni.`));
  let thr=null;
  if(mbps!=null){thr=mbps>=p.mbps?"good":mbps>=0.6*p.mbps?"borderline":"bad";b.push(L(`<b>Speed</b>: ${mbps} Mbps vs ~${p.mbps} needed → ${ {good:"enough",borderline:"tight",bad:"short"}[thr] }.`,`<b>Velocità</b>: ${mbps} Mbps contro ~${p.mbps} richiesti → ${ {good:"sufficiente",borderline:"giusta giusta",bad:"insufficiente"}[thr] }.`));}
  else b.push(L(`<b>Speed</b>: not measured yet — run a stress test (needs ~${p.mbps} Mbps for this profile).`,`<b>Velocità</b>: non ancora misurata — fai uno stress test (servono ~${p.mbps} Mbps per questo profilo).`));
  let buf=null;
  if(latAdd!=null){buf=latAdd<=p.latSoft?"good":latAdd<=p.latHard?"borderline":"bad";b.push(L(`<b>Under load</b>: +${latAdd} ms → ${ {good:"stable",borderline:"some lag",bad:"stutters"}[buf] }.`,`<b>Sotto carico</b>: +${latAdd} ms → ${ {good:"stabile",borderline:"qualche lag",bad:"scatta"}[buf] }.`));}
  if(h.trend_dir){
    const db=h.trend_db||0;
    const txt=h.trend_dir==="flat"
      ? L("essentially stable over the period.","sostanzialmente stabile nel periodo.")
      : h.trend_dir==="up"
        ? L(`improved by ~${db} dB since the start of the period.`,`migliorato di ~${db} dB dall'inizio del periodo.`)
        : L(`weakened by ~${db} dB since the start of the period.`,`peggiorato di ~${db} dB dall'inizio del periodo.`);
    b.push("<b>"+L("Trend","Andamento")+"</b>: "+txt);
  }
  const level=WORST(cov,rel,thr,buf)||"unknown";
  return {level,bullets:b};
}

function summarySentence(h,level){
  if(!h||!h.n) return L("Waiting for the first samples from the phone.","In attesa dei primi campioni dal telefono.");
  const rsrp=(h.rsrp||{}).median,okq=h.pct_ok_quality,up=h.uplink_ok_pct;
  let worstTxt="";const wd=(h.by_hour||[]).filter(b=>b.n&&b.ok_quality_pct!=null);
  if(wd.length){const w=wd.reduce((a,b)=>b.ok_quality_pct<a.ok_quality_pct?b:a);worstTxt=L(` Weakest around ${w.hour}:00.`,` Più debole verso le ${w.hour}:00.`);}
  const verdict={good:L("should comfortably cover","dovrebbe coprire comodamente"),borderline:L("is borderline for","è al limite per"),bad:L("is likely not enough for","probabilmente non basta per"),unknown:L("needs more data for","ha bisogno di più dati per")}[level];
  return L(
    `Signal is typically ${sig(rsrp).w} (${rsrp} dBm), usable ${okq}% of the time, data reliable ${up}%.${worstTxt} This connection ${verdict} “${profName(profile)}”.`,
    `Il segnale è tipicamente ${sig(rsrp).w} (${rsrp} dBm), usabile nel ${okq}% del tempo, dato affidabile al ${up}%.${worstTxt} Questa connessione ${verdict} “${profName(profile)}”.`);
}

function renderPotential(h){
  const body=$("potBody"),lvlEl=$("potLvl");
  if(!h||!h.n){lvlEl.className="badge unknown";lvlEl.textContent=L("not enough data","dati insufficienti");body.innerHTML=`<li class="muted">—</li>`;return;}
  const r=(h.rsrp||{}).median,bands=Object.keys(h.bands||{}),nb=bands.length,low=h.low_band_pct>0,g5=h.seen_5g;
  const b=[];
  b.push(g5
    ?L(`<b>5G</b>: seen here — a 5G router (e.g. ZTE G5C) could be a real jump over LTE.`,`<b>5G</b>: visto qui — un router 5G (es. ZTE G5C) potrebbe essere un vero salto rispetto all'LTE.`)
    :L(`<b>5G</b>: never seen (LTE only) — a 5G router's 5G edge would not apply here; you'd stay on LTE.`,`<b>5G</b>: mai visto (solo LTE) — il vantaggio 5G di un router qui non si applicherebbe; resteresti su LTE.`));
  b.push(nb>=2
    ?L(`<b>Bands</b>: ${bands.join(", ")} (${nb}) — a router with carrier aggregation could combine them for more bandwidth than a phone (one band at a time).`,`<b>Bande</b>: ${bands.join(", ")} (${nb}) — un router con carrier aggregation potrebbe combinarle per più banda di un telefono (una banda per volta).`)
    :L(`<b>Bands</b>: ${bands.join(", ")||"—"} — little aggregation opportunity.`,`<b>Bande</b>: ${bands.join(", ")||"—"} — poca opportunità di aggregazione.`));
  b.push(low
    ?L(`<b>Low-band 800 present</b> ${h.low_band_pct}% of the time — good reach; a directional external antenna aimed at the tower would mainly raise SINR (speed & stability).`,`<b>Banda bassa 800 presente</b> nel ${h.low_band_pct}% del tempo — buona portata; un'antenna esterna direzionale verso il ripetitore alzerebbe soprattutto il SINR (velocità e stabilità).`)
    :L(`<b>No low-band</b> — an external antenna could help catch it and improve reach.`,`<b>Nessuna banda bassa</b> — un'antenna esterna potrebbe aiutare a prenderla e migliorare la portata.`));
  if(r!=null){
    const est=r<=-105?L("weak signal → an external antenna could add a lot (often +5–15 dB, roughly 1.5–3× throughput when the link is the bottleneck).","segnale debole → un'antenna esterna potrebbe aggiungere parecchio (spesso +5–15 dB, grossomodo 1,5–3× di throughput quando il collo di bottiglia è il link).")
      :r<=-95?L("fair signal → moderate gains from an external antenna (a few dB, steadier speed).","segnale discreto → guadagni moderati da un'antenna esterna (qualche dB, velocità più stabile).")
      :L("already strong → little to gain on the link itself; a better device mostly helps distribution.","già forte → poco da guadagnare sul link; un apparato migliore aiuta soprattutto la distribuzione.");
    b.push(L(`<b>Antenna</b>: typical signal ${r} dBm — ${est}`,`<b>Antenna</b>: segnale tipico ${r} dBm — ${est}`));
  }
  b.push(L(`<b>WiFi 6 / AX1800</b>: LAN side only — it serves many devices (your 7 + 2 Netflix) in the house better, but does NOT add mobile bandwidth.`,`<b>WiFi 6 / AX1800</b>: solo lato LAN — serve meglio tanti dispositivi (i tuoi 7 + 2 Netflix) in casa, ma NON aggiunge banda mobile.`));
  b.push(L(`<i>Note: the phone doesn't report SINR — to confirm an antenna's gain, check the router's own admin page (it shows SINR) at the same spot.</i>`,`<i>Nota: il telefono non riporta il SINR — per confermare il guadagno dell'antenna, guarda la pagina admin del router (mostra il SINR) nello stesso punto.</i>`));
  let lvl,txt;
  if(g5){lvl="good";txt=L("HIGH (5G available)","ALTO (5G disponibile)");}
  else if(r!=null&&r<=-105){lvl="good";txt=L("HIGH (weak signal — antenna would help)","ALTO (segnale debole — l'antenna aiuterebbe)");}
  else if((r!=null&&r<=-95)||nb>=2){lvl="borderline";txt=L("MEDIUM (antenna + CA gains)","MEDIO (guadagni da antenna + CA)");}
  else {lvl="unknown";txt=L("LOW on the link (device mainly helps distribution)","BASSO sul link (l'apparato aiuta soprattutto la distribuzione)");}
  lvlEl.className="badge "+lvl;lvlEl.textContent=L("Upgrade potential: ","Potenziale upgrade: ")+txt;
  body.innerHTML=b.map(x=>`<li>${x}</li>`).join("");
}

function render(){
  fillLabels();
  const h=last;
  $("sub").textContent=h&&h.n?`${h.n.toLocaleString()} ${L("samples","campioni")} · ${(h.operators||[]).join(", ")||"—"} · ${L("last","ultimi")} ${h.window_days}${L("d","gg")}`:L("waiting for data…","in attesa di dati…");
  if(!h){return;}
  const c=buildConclusions(h);
  $("vLvl").className="badge "+c.level;
  $("vLvl").textContent={good:L("Looks good","Va bene"),borderline:L("Borderline","Al limite"),bad:L("Not enough","Non basta"),unknown:L("Not enough data","Dati insufficienti")}[c.level];
  $("vFor").textContent=L("for","per")+" “"+profName(profile)+"”";
  $("summary").textContent=summarySentence(h,c.level);
  $("concl").innerHTML=c.bullets.map(x=>`<li>${x}</li>`).join("");
  renderMeter(h);renderKpis(h);renderByDay(h);renderHour(h);renderCov(h);renderPotential(h);
}

function setCollectorStatus(online){
  $("statusPill").classList.toggle("online",online);
  $("statusText").textContent=online?L("online","online"):L("offline","offline");
}

async function loadCollectorStatus(){
  try{
    const headers={};const tok=localStorage.getItem("pw_token");if(tok)headers["X-Token"]=tok;
    const r=await fetch("/data",{cache:"no-store",headers});
    if(!r.ok)throw new Error("status request failed");
    setCollectorStatus(!!(await r.json()).reachable);
  }catch(e){setCollectorStatus(false);}
}

async function load(){
  try{
    const headers={};const tok=localStorage.getItem("pw_token");if(tok)headers["X-Token"]=tok;
    let r=await fetch(`/history?days=${days}`,{cache:"no-store",headers});
    if(r.status===403){const t=prompt("Token:");if(t){localStorage.setItem("pw_token",t);return load();}return;}
    last=await r.json();render();
  }catch(e){$("sub").textContent="collector offline";}
}

$("segDays").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;days=parseInt(b.dataset.d,10);[...$("segDays").children].forEach(x=>x.classList.toggle("on",x===b));load();});
$("langBtn").addEventListener("click",()=>{lang=lang==="it"?"en":"it";localStorage.setItem("pw_lang",lang);render();});
function curTheme(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");}
function syncThemeBtn(){$("themeBtn").textContent=curTheme()==="dark"?L("light","chiaro"):L("dark","scuro");}
$("themeBtn").addEventListener("click",()=>{const t=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("pw_theme",t);}catch(e){}syncThemeBtn();});
$("profile").addEventListener("change",e=>{profile=e.target.value;localStorage.setItem("pw_profile",profile);$("customWrap").style.display=profile==="custom"?"":"none";render();});
$("customMbps").addEventListener("input",render);
$("dayStrip").addEventListener("click",e=>{const c=e.target.closest(".daycell");if(!c||!last)return;selectedDay=c.dataset.day;renderByDay(last);});

// mobile sidebar
function closeNav(){$("app").classList.remove("nav-open");}
$("menuBtn").addEventListener("click",()=>$("app").classList.toggle("nav-open"));
$("scrim").addEventListener("click",closeNav);
document.querySelectorAll(".side-link").forEach(a=>a.addEventListener("click",()=>{if(window.innerWidth<=900)closeNav();}));

fillLabels();syncThemeBtn();load();loadCollectorStatus();setInterval(load,60000);setInterval(loadCollectorStatus,10000);
</script>
</body>
