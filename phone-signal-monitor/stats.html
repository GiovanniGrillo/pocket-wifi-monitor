<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reception statistics</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;--panel:#0f141b;--card:#0f141b;--line:#1d2531;--line-soft:#161d27;
    --txt:#e7ebf1;--dim:#8b96a6;--faint:#58626f;--accent:#3fb950;--warn:#d6a01b;--bad:#ef4e3a;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--panel:#fff;--card:#fff;--line:#e2e7ee;--line-soft:#edf0f4;--txt:#0f141b;--dim:#596575;--faint:#8a94a2;}}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .v,.kpi .v{font-variant-numeric:tabular-nums;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px;}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;margin-bottom:16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);}
  .logo{width:26px;height:26px;border-radius:5px;flex:none;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-weight:600;font-size:11px;}
  h1{margin:0;font-size:14px;font-weight:600;}
  .sub{margin:0;font-size:12.5px;color:var(--dim);}
  .spacer{flex:1;}
  .btn{font:inherit;font-size:12.5px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{color:var(--txt);border-color:var(--faint);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .seg button{font:inherit;font-size:12.5px;background:transparent;color:var(--dim);border:0;padding:6px 12px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#0b0f14;font-weight:600;}

  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .controls label{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;}
  select,input[type=number]{font:inherit;font-size:13px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 9px;}
  input[type=number]{width:90px;}

  .verdict{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 18px;margin-bottom:14px;}
  .verdict .lvl{font-size:22px;font-weight:750;letter-spacing:-.3px;}
  .verdict .for{font-size:12.5px;color:var(--dim);margin-top:2px;}
  .lvl.good{color:var(--accent);} .lvl.borderline{color:var(--warn);} .lvl.bad{color:var(--bad);} .lvl.unknown{color:var(--dim);}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px;}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);}
  .kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px;margin-top:3px;}
  .kpi .v small{font-size:13px;color:var(--dim);font-weight:500;}
  .v.good{color:var(--accent);} .v.warn{color:var(--warn);} .v.bad{color:var(--bad);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .card h2{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);}
  svg{display:block;width:100%;height:auto;}
  .qbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
  .qbar .name{width:90px;color:var(--dim);} .qbar .track{flex:1;height:14px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:7px;overflow:hidden;}
  .qbar .fill{height:100%;border-radius:7px;} .qbar .pct{width:42px;text-align:right;font-family:var(--mono);}
  ul.concl{margin:0;padding-left:18px;} ul.concl li{margin:8px 0;font-size:14px;} ul.concl b{color:var(--txt);}
  .legend{font-size:11px;color:var(--faint);margin-top:6px;}
  .muted{color:var(--faint);}
  footer{margin-top:20px;text-align:center;font-size:12px;color:var(--faint);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">PW</div>
    <div>
      <h1 data-i18n="title">Reception statistics</h1>
      <p class="sub" id="sub">loading…</p>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="segDays">
      <button data-d="7">7</button><button data-d="30" class="on">30</button><button data-d="365" data-i18n="all">all</button>
    </div>
    <button class="btn" id="langBtn">🌐 IT</button>
    <a class="btn" href="/" data-i18n="live">◀ live</a>
  </header>

  <div class="controls">
    <label data-i18n="profile">Usage profile</label>
    <select id="profile"></select>
    <span id="customWrap" style="display:none">
      <input type="number" id="customMbps" min="1" max="1000" value="10">
      <span class="muted" data-i18n="target_mbps">target Mbps</span>
    </span>
  </div>

  <div class="verdict">
    <div class="lvl unknown" id="vLvl">—</div>
    <div class="for" id="vFor"></div>
  </div>

  <div class="card">
    <h2 data-i18n="conclusions">Conclusions</h2>
    <ul class="concl" id="concl"><li class="muted">—</li></ul>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2 data-i18n="rsrp_over_time">RSRP over time</h2>
    <svg id="rsrpChart" viewBox="0 0 800 220" preserveAspectRatio="none"></svg>
    <div class="legend" id="rsrpLegend"></div>
  </div>
  <div class="card">
    <h2 data-i18n="coverage">Sample coverage (gaps = phone/PC off)</h2>
    <svg id="covChart" viewBox="0 0 800 90" preserveAspectRatio="none"></svg>
  </div>
  <div class="card">
    <h2 data-i18n="quality_dist">Quality distribution</h2>
    <div id="qdist"></div>
  </div>
  <div class="card">
    <h2 data-i18n="by_hour">By hour of day (local)</h2>
    <svg id="hourChart" viewBox="0 0 800 140" preserveAspectRatio="none"></svg>
    <div class="legend" id="hourLegend"></div>
  </div>

  <footer><span id="foot"></span></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const dash = v => (v === undefined || v === null || v === "") ? null : v;
let days = 30, last = null;
let lang = (localStorage.getItem("pw_lang") || "en");

// ---- usage profiles: target sustained Mbps + latency-under-load thresholds (ms added) ----
const PROFILES = {
  family: {mbps:15, latSoft:120, latHard:250},
  uhd4k:  {mbps:30, latSoft:150, latHard:300},
  work:   {mbps:8,  latSoft:60,  latHard:120},
  basic:  {mbps:4,  latSoft:200, latHard:400},
  custom: {mbps:10, latSoft:120, latHard:250},
};
let profile = localStorage.getItem("pw_profile") || "family";

const T = {
  en:{title:"Reception statistics",live:"◀ live",all:"all",profile:"Usage profile",target_mbps:"target Mbps",
      conclusions:"Conclusions",rsrp_over_time:"RSRP over time",coverage:"Sample coverage (gaps = phone/PC off)",
      quality_dist:"Quality distribution",by_hour:"By hour of day (local)",by_hour_legend:"% of time with usable quality (≥ fair) per hour — low bars at peak evening hours = congestion",k_data_used:"Data used (est.)",
      p_family:"Family / streaming",p_uhd4k:"Streaming 4K",p_work:"Remote work / video calls",p_basic:"Basic: browsing + smart home",p_custom:"Custom",
      k_rsrp:"Median RSRP",k_qual:"Quality ≥ fair",k_up:"Uplink OK",k_band:"Main band",k_samples:"Samples",k_days:"Days covered",k_http:"HTTP latency",
      good:"Looks good",borderline:"Borderline",bad:"Not enough",unknown:"Not enough data yet",
      forUse:u=>`for “${u}”`,waiting:"waiting for data from the phone…",
      updated:"updated",every:"every 60 s",
      q:{excellent:"excellent",good:"good",fair:"fair",poor:"poor",very_poor:"very poor"}},
  it:{title:"Statistiche presa rete",live:"◀ live",all:"tutto",profile:"Profilo d'uso",target_mbps:"target Mbps",
      conclusions:"Conclusioni",rsrp_over_time:"Andamento RSRP",coverage:"Copertura campioni (buchi = telefono/PC spenti)",
      quality_dist:"Distribuzione qualità",by_hour:"Per ora del giorno (locale)",by_hour_legend:"% di tempo con qualità usabile (≥ discreta) per ora — barre basse la sera = congestione",k_data_used:"Dati usati (stima)",
      p_family:"Famiglia / streaming",p_uhd4k:"Streaming 4K",p_work:"Smart working / videochiamate",p_basic:"Base: navigazione + domotica",p_custom:"Personalizzato",
      k_rsrp:"RSRP mediano",k_qual:"Qualità ≥ discreta",k_up:"Uplink ok",k_band:"Banda prevalente",k_samples:"Campioni",k_days:"Giorni coperti",k_http:"Latenza HTTP",
      good:"Va bene",borderline:"Al limite",bad:"Non basta",unknown:"Dati ancora insufficienti",
      forUse:u=>`per “${u}”`,waiting:"in attesa di dati dal telefono…",
      updated:"aggiornato",every:"ogni 60 s",
      q:{excellent:"eccellente",good:"buono",fair:"discreto",poor:"scarso",very_poor:"pessimo"}},
};
const tr = () => T[lang];
const L = (en, it) => lang === "it" ? it : en;
const profName = id => tr()["p_" + id];

function applyStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(tr()[k]) el.textContent=tr()[k]; });
  $("langBtn").textContent = lang === "it" ? "🌐 EN" : "🌐 IT";
  // profile dropdown
  const sel = $("profile"); const cur = profile;
  sel.innerHTML = Object.keys(PROFILES).map(id=>`<option value="${id}">${profName(id)}</option>`).join("");
  sel.value = cur;
  $("customWrap").style.display = profile === "custom" ? "" : "none";
  $("foot").textContent = tr().every;
}

// ---------- conclusions engine ----------
function profileTarget(){
  const p = {...PROFILES[profile]};
  if (profile === "custom") p.mbps = Math.max(1, parseInt($("customMbps").value,10) || 10);
  return p;
}
const WORST = (...xs)=>{ const o=["bad","borderline","good"]; return xs.filter(Boolean).sort((a,b)=>o.indexOf(a)-o.indexOf(b))[0]; };

function buildConclusions(h){
  const p = profileTarget();
  const bullets = [];
  if (!h || !h.n){ return {level:"unknown", bullets:[L("No samples yet — start the phone agent and they will appear here.","Nessun campione ancora — avvia l'agente sul telefono e compariranno qui.")]}; }
  const rsrp = (h.rsrp||{}).median;
  const okq = h.pct_ok_quality, up = h.uplink_ok_pct;
  const st = h.last_stress || {};
  const mbps = dash(st.dl_mbps);
  const latAdd = (st.lat_idle_ms!=null && st.lat_load_ms!=null) ? Math.round(st.lat_load_ms - st.lat_idle_ms) : null;

  // coverage (signal)
  let cov = (rsrp==null) ? null : (rsrp>=-100 && okq>=70) ? "good" : (rsrp>=-110 && okq>=40) ? "borderline" : "bad";
  if (rsrp!=null) bullets.push(L(
    `<b>Signal</b>: median RSRP ${rsrp} dBm, usable (≥ fair) ${okq}% of the time → ${ {good:"solid",borderline:"usable but dips",bad:"weak"}[cov] }.`,
    `<b>Segnale</b>: RSRP mediano ${rsrp} dBm, usabile (≥ discreta) nel ${okq}% del tempo → ${ {good:"solido",borderline:"usabile ma con cali",bad:"debole"}[cov] }.`));

  // reliability (uplink http 204)
  let rel = (up==null) ? null : up>=95 ? "good" : up>=80 ? "borderline" : "bad";
  if (up!=null) bullets.push(L(
    `<b>Reliability</b>: data worked (HTTP 204) ${up}% of samples → ${ {good:"dependable link",borderline:"occasional drops",bad:"frequent outages"}[rel] }.`,
    `<b>Affidabilità</b>: dato funzionante (HTTP 204) nel ${up}% dei campioni → ${ {good:"link affidabile",borderline:"cali occasionali",bad:"buchi frequenti"}[rel] }.`));

  // throughput (needs a stress test)
  let thr = null;
  if (mbps!=null){
    thr = mbps>=p.mbps ? "good" : mbps>=0.6*p.mbps ? "borderline" : "bad";
    bullets.push(L(
      `<b>Throughput</b>: last stress test ${mbps} Mbps vs ~${p.mbps} Mbps needed → ${ {good:"enough",borderline:"tight",bad:"short"}[thr] }.`,
      `<b>Velocità</b>: ultimo stress test ${mbps} Mbps contro ~${p.mbps} Mbps richiesti → ${ {good:"sufficiente",borderline:"giusta giusta",bad:"insufficiente"}[thr] }.`));
  } else {
    bullets.push(L(
      `<b>Throughput</b>: no stress test yet — run one (dashboard ▸ stress test) to judge Mbps against the ~${p.mbps} Mbps this profile needs.`,
      `<b>Velocità</b>: nessuno stress test ancora — lanciane uno (dashboard ▸ stress test) per valutare i Mbps rispetto ai ~${p.mbps} Mbps richiesti da questo profilo.`));
  }

  // latency under load (bufferbloat)
  let buf = null;
  if (latAdd!=null){
    buf = latAdd<=p.latSoft ? "good" : latAdd<=p.latHard ? "borderline" : "bad";
    bullets.push(L(
      `<b>Latency under load</b>: +${latAdd} ms when busy → ${ {good:"stable",borderline:"some lag",bad:"bufferbloat: calls/games will stutter"}[buf] }.`,
      `<b>Latenza sotto carico</b>: +${latAdd} ms quando è occupato → ${ {good:"stabile",borderline:"qualche lag",bad:"bufferbloat: chiamate/giochi scattano"}[buf] }.`));
  }

  // band note
  if (h.band_main) bullets.push(L(
    `<b>Band</b>: mostly ${h.band_main}${h.low_band_pct>0?`, low-band (sub-GHz, good reach) ${h.low_band_pct}% of the time`:" — no sub-GHz band, limited reach through walls"}.`,
    `<b>Banda</b>: prevalente ${h.band_main}${h.low_band_pct>0?`, banda bassa (sub-GHz, buona portata) nel ${h.low_band_pct}% del tempo`:" — nessuna banda bassa, portata nei muri limitata"}.`));

  if (h.trend) bullets.push("<b>"+L("Trend","Andamento")+"</b>: "+h.trend);

  const level = WORST(cov, rel, thr, buf) || "unknown";
  if (!mbps) bullets.push("<i>"+L("These stats measure reception; run a stress test for the actual speed.","Queste statistiche misurano la presa; per la velocità reale fai uno stress test.")+"</i>");
  return {level, bullets};
}

// ---------- render ----------
function rsrpClass(v){ if(v==null) return ''; if(v>=-90) return 'good'; if(v>=-100) return 'warn'; return 'bad'; }
function kpi(label,value,cls,sub){ return `<div class="kpi"><div class="l">${label}</div><div class="v ${cls||''}">${value}${sub?` <small>${sub}</small>`:''}</div></div>`; }

function renderKpis(h){
  const r=h.rsrp||{}, t=tr();
  const tiles=[
    kpi(t.k_rsrp, r.median!=null?`${r.median}`:'—', rsrpClass(r.median), r.median!=null?'dBm':''),
    kpi(t.k_qual, h.pct_ok_quality!=null?h.pct_ok_quality:'—', h.pct_ok_quality>=80?'good':h.pct_ok_quality>=50?'warn':'bad','%'),
    kpi(t.k_up, h.uplink_ok_pct!=null?h.uplink_ok_pct:'—', h.uplink_ok_pct>=95?'good':h.uplink_ok_pct>=80?'warn':'bad','%'),
    kpi(t.k_band, h.band_main||'—', h.low_band_pct>0?'good':''),
    kpi(t.k_samples, h.n!=null?h.n.toLocaleString():'—'),
    kpi(t.k_days, h.days_covered!=null?h.days_covered:'—'),
  ];
  if(h.http_ms_median!=null) tiles.push(kpi(t.k_http,h.http_ms_median,h.http_ms_median<150?'good':h.http_ms_median<400?'warn':'bad','ms'));
  if(h.data_used_mb!=null) tiles.push(kpi(t.k_data_used,h.data_used_mb,'','MB'));
  $("kpis").innerHTML=tiles.join("");
}
function renderByHour(h){
  const bh=h.by_hour||[],W=800,H=140,padL=28,padR=8,padT=8,padB=22;
  if(!bh.some(x=>x.n)){ $("hourChart").innerHTML=`<text x="400" y="70" fill="var(--faint)" font-size="13" text-anchor="middle">${L("no data","nessun dato")}</text>`; $("hourLegend").textContent=""; return; }
  const bw=(W-padL-padR)/24; let g='';
  for(let v=0;v<=100;v+=50){const y=padT+(100-v)*(H-padT-padB)/100; g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)"/><text x="2" y="${y+4}" fill="var(--faint)" font-size="10">${v}</text>`;}
  bh.forEach((b,i)=>{ if(b.ok_quality_pct==null) return;
    const val=b.ok_quality_pct, hgt=(H-padT-padB)*val/100, c=val>=80?'var(--accent)':val>=50?'var(--warn)':'var(--bad)', x=padL+i*bw;
    g+=`<rect x="${(x+1).toFixed(1)}" y="${(H-padB-hgt).toFixed(1)}" width="${Math.max(1,bw-2).toFixed(1)}" height="${hgt.toFixed(1)}" fill="${c}"><title>${b.hour}:00 — ${val}% (${b.n})</title></rect>`;
  });
  for(let hh=0;hh<24;hh+=3){const x=padL+hh*bw+bw/2; g+=`<text x="${x.toFixed(1)}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="middle">${hh}</text>`;}
  $("hourChart").innerHTML=g; $("hourLegend").textContent=tr().by_hour_legend;
}
function renderRsrpChart(h){
  const s=h.series||[],W=800,H=220,padL=42,padR=12,padT=12,padB=24,yMin=-120,yMax=-60;
  const x=i=>padL+(s.length<=1?0:i*(W-padL-padR)/(s.length-1)), y=v=>padT+(yMax-v)*(H-padT-padB)/(yMax-yMin);
  let g='';
  for(let v=-60;v>=-120;v-=10){const yy=y(v);g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)"/><text x="4" y="${yy+4}" fill="var(--faint)" font-size="11">${v}</text>`;}
  let pts=[],segs=[];
  s.forEach((p,i)=>{if(p.rsrp_median==null){if(pts.length)segs.push(pts);pts=[];}else pts.push(`${x(i).toFixed(1)},${y(p.rsrp_median).toFixed(1)}`);});
  if(pts.length)segs.push(pts);
  segs.forEach(seg=>g+=`<polyline points="${seg.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`);
  $("rsrpChart").innerHTML=g||`<text x="400" y="110" fill="var(--faint)" font-size="13" text-anchor="middle">${L("no data","nessun dato")}</text>`;
  $("rsrpLegend").textContent = s.length ? L("higher = better","più alto = meglio")+" · "+(h.bucket==="day"?L("daily median","media giornaliera"):L("hourly median","media oraria")) : "";
}
function renderCoverage(h){
  const s=h.series||[],W=800,H=90,padB=4;
  if(!s.length){$("covChart").innerHTML=`<text x="400" y="45" fill="var(--faint)" font-size="13" text-anchor="middle">${L("no data","nessun dato")}</text>`;return;}
  const maxN=Math.max(...s.map(p=>p.n),1),bw=W/s.length;
  $("covChart").innerHTML=s.map((p,i)=>{const hgt=(H-padB)*p.n/maxN;const c=p.ok_rate>=95?'var(--accent)':p.ok_rate>=50?'var(--warn)':'var(--bad)';return `<rect x="${(i*bw).toFixed(1)}" y="${(H-padB-hgt).toFixed(1)}" width="${Math.max(1,bw-1).toFixed(1)}" height="${hgt.toFixed(1)}" fill="${c}"/>`;}).join("");
}
function renderQdist(h){
  const p=h.quality_pct||{},q=tr().q,order=["excellent","good","fair","poor","very_poor"];
  const col={excellent:"var(--accent)",good:"var(--accent)",fair:"var(--warn)",poor:"var(--bad)",very_poor:"var(--bad)"};
  $("qdist").innerHTML=order.map(k=>{const v=p[k]||0;return `<div class="qbar"><span class="name">${q[k]}</span><span class="track"><span class="fill" style="width:${v}%;background:${col[k]}"></span></span><span class="pct">${v}%</span></div>`;}).join("");
}

function renderAll(){
  applyStatic();
  const h = last;
  if(!h){return;}
  $("sub").textContent = h.n ? `${h.n.toLocaleString()} ${L("samples","campioni")} · ${(h.operators||[]).join(", ")||"—"}` : tr().waiting;
  const c = buildConclusions(h);
  $("vLvl").className = "lvl " + c.level;
  $("vLvl").textContent = tr()[c.level] || tr().unknown;
  $("vFor").textContent = tr().forUse(profName(profile));
  $("concl").innerHTML = c.bullets.map(b=>`<li>${b}</li>`).join("");
  renderKpis(h); renderRsrpChart(h); renderCoverage(h); renderQdist(h); renderByHour(h);
}

async function load(){
  try{
    const r = await fetch(`/history?days=${days}`,{cache:"no-store",headers: tokHeaders()});
    if(r.status===403){ const t=prompt("Token:"); if(t){localStorage.setItem("pw_token",t); return load();} return; }
    last = await r.json(); renderAll();
    $("foot").textContent = tr().updated+" "+new Date().toLocaleTimeString()+" · "+tr().every;
  }catch(e){ $("sub").textContent="collector offline"; }
}
function tokHeaders(){ const t=localStorage.getItem("pw_token"); return t?{"X-Token":t}:{}; }

$("segDays").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;days=parseInt(b.dataset.d,10);[...$("segDays").children].forEach(x=>x.classList.toggle("on",x===b));load();});
$("langBtn").addEventListener("click",()=>{lang=lang==="it"?"en":"it";localStorage.setItem("pw_lang",lang);renderAll();});
$("profile").addEventListener("change",e=>{profile=e.target.value;localStorage.setItem("pw_profile",profile);$("customWrap").style.display=profile==="custom"?"":"none";renderAll();});
$("customMbps").addEventListener("input",renderAll);

applyStatic();
load();
setInterval(load,60000);
</script>
